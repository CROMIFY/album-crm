name: Deploy to Vercel (production)

# Vercel Hobby no soporta la integracion nativa de Git para repos privados
# de organizacion, asi que el auto-deploy va por aqui via Vercel CLI + token.
#
# Importante: el deploy tiene que compilarse en la infraestructura de
# Vercel (deploy por codigo fuente), no en el runner de GitHub Actions.
# "vercel build" en local no puede leer las env vars marcadas como
# "Sensitive" (llegan como el literal "[SENSITIVE]" y rompen el build) --
# asi se rompio crm.cromify.app (Supabase URL / Sentry DSN) la primera vez.
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm en Windows quita del lockfile @emnapi/core y @emnapi/runtime
      # (dependencias de los paquetes wasm de sharp y napi-rs) y npm en Linux
      # las pide, asi que npm ci falla con "Missing: @emnapi/... from lock
      # file" cada vez que el lockfile se regenera en Windows. En ese caso
      # npm install, que respeta las versiones del lockfile y solo anade lo
      # que falta.
      - name: Install dependencies
        run: |
          npm ci || {
            echo "::warning::npm ci fallo (lockfile generado en Windows); se usa npm install"
            npm install --no-audit --no-fund
          }

      # No corre "npm run verify" completo porque incluye "build", y el
      # build local no tiene acceso a las env vars "Sensitive" (ver nota de
      # arriba) -- lint+typecheck+test no las necesitan y ya cubren el
      # hueco real (un commit roto llegando a produccion sin que nada lo pare).
      - name: Lint, typecheck & test
        run: npm run lint && npm run typecheck && npm run test

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
