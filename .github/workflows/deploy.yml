name: Deploy to Vercel (production)

# Vercel Hobby no soporta la integracion nativa de Git para repos privados
# de organizacion, asi que el auto-deploy va por aqui via Vercel CLI + token.
#
# Importante: el deploy tiene que compilarse en la infraestructura de
# Vercel (deploy por codigo fuente), no en el runner de GitHub Actions.
# "vercel build" en local no puede leer las env vars marcadas como
# "Sensitive" (llegan como el literal "[SENSITIVE]" y rompen el build) --
# asi se rompio crm.cromify.app (Supabase URL / Sentry DSN) la primera vez.
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
